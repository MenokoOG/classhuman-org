<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<style>
  .title { font: 700 28px Arial, sans-serif; fill: #111; }
  .box { fill: #f8f9fb; stroke: #222; stroke-width: 2; rx: 14; }
  .label { font: 600 18px Arial, sans-serif; fill: #111; }
  .sub { font: 14px Arial, sans-serif; fill: #333; }
  .edge { stroke: #222; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .dash { stroke-dasharray: 8 6; }
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#222" /></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="45" class="title">Layered Zero Trust Governance Architecture</text>

<path class="edge" d="M600.0,158 C600.0,169.0 600.0,169.0 600.0,180"/>
<path class="edge" d="M600.0,258 C600.0,269.0 600.0,269.0 600.0,280"/>
<path class="edge" d="M600.0,358 C600.0,369.0 600.0,369.0 600.0,380"/>
<path class="edge" d="M600.0,458 C600.0,469.0 600.0,469.0 600.0,480"/>
<path class="edge" d="M600.0,558 C600.0,569.0 600.0,569.0 600.0,580"/>
<path class="edge dash" d="M600.0,580 C600.0,469.0 600.0,469.0 600.0,358"/>
<path class="edge dash" d="M600.0,580 C600.0,419.0 600.0,419.0 600.0,258"/>
<path class="edge dash" d="M600.0,280 C600.0,219.0 600.0,219.0 600.0,158"/>
<rect class="box" x="260" y="80" width="680" height="78" rx="14"/>
<text x="600.0" y="112" text-anchor="middle" class="label">L1 — Moral and Human Constraints</text>
<text x="600.0" y="134" text-anchor="middle" class="sub">CIPSE(D²), dignity, capacity, rights</text>
<rect class="box" x="260" y="180" width="680" height="78" rx="14"/>
<text x="600.0" y="212" text-anchor="middle" class="label">L2 — Truth and Governance</text>
<text x="600.0" y="234" text-anchor="middle" class="sub">SSOT, transparency, dispute lifecycle</text>
<rect class="box" x="260" y="280" width="680" height="78" rx="14"/>
<text x="600.0" y="312" text-anchor="middle" class="label">L3 — Decision Control</text>
<text x="600.0" y="334" text-anchor="middle" class="sub">OODA loop, 10-pass validation</text>
<rect class="box" x="260" y="380" width="680" height="78" rx="14"/>
<text x="600.0" y="412" text-anchor="middle" class="label">L4 — Security and Authorization</text>
<text x="600.0" y="434" text-anchor="middle" class="sub">Zero Trust, ICAM, audit, reversibility</text>
<rect class="box" x="260" y="480" width="680" height="78" rx="14"/>
<text x="600.0" y="512" text-anchor="middle" class="label">L5 — Domain Systems</text>
<text x="600.0" y="534" text-anchor="middle" class="sub">AI, law, finance, infrastructure, health, logistics</text>
<rect class="box" x="260" y="580" width="680" height="78" rx="14"/>
<text x="600.0" y="612" text-anchor="middle" class="label">L6 — Execution and Operations</text>
<text x="600.0" y="634" text-anchor="middle" class="sub">Humans, agents, machines, processes</text>
</svg>